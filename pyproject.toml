[project]
name = "ica-denoising"
version = "0.1.0"
description = "ICA/BSS denoising experiments for calcium-imaging traces"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "joblib",
    "matplotlib",
    "numpy",
    "pandas",
    "pytest>=9.0.3",
    "scikit-learn",
    "scipy",
]

[tool.pytest.ini_options]
pythonpath = [
    "src",
    "src/core",
]
