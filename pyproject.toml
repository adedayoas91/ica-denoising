[project]
name = "ica-denoising"
version = "0.1.0"
description = "ICA/BSS denoising experiments for calcium-imaging traces"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "joblib",
    "matplotlib",
    "numba",
    "numpy",
    "pandas",
    "pytest>=9.0.3",
    "scikit-learn",
    "scipy",
    "seaborn>=0.13.2",
    "tigramite>=5.2.10.1",
]

[tool.pytest.ini_options]
pythonpath = [
    "src",
]
